<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Website</title>
    <link rel="icon" href="media/wings 2 icon.ico">
    <link rel="stylesheet" href="css part/style1.css" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" type="text/css">
</head>
<body>
    <div class="main">
        <div class="navbar">
            <img class="logo" src="media/wings 2 icon.ico" alt="wing2_img">
            <button type="button">Sign Up</button>
        </div>
        <div class="content">
            <small>Welcome to our</small>
            <h1>World's<br/>Creative Studio</h1>
            <button type="button">Take a tour</button>
        </div>
        <div class="side-bar">
            <i class="fa-solid fa-bars"></i>

            <div class="social-links">
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-twitter"></i>
            </div> <!-- social-links -->

            <div class="useful-links">
                <i class="fa-solid fa-share-nodes useful"></i>
                <i class="fa-solid fa-circle-info useful"></i>
            </div> <!-- end useful-links -->
        </div> <!-- end side-bar -->

        <!-- Hacktoberfest 2023 Contribution Instructions -->
        <!--
        1. Star this repository.
        2. Navigate to index.html or main.css to do a crazy contribution file.
        3. Edit the file and insert the line of text in the specified location in the format as given in comment.
        4. Now click on Propose button.
        5. Create a new pull request.
        6. Wait for your Pull Request to be reviewed and merged!
        7. Enjoy and welcome to Hacktoberfest 2023 and Keep Contributing :)
        -->
        <div class="bubbles">
            <img src="media/bubble.png" alt="bubble_1">
            <img src="media/bubble.png" alt="bubble_2">
            <img src="media/bubble.png" alt="bubble_3">
            <img src="media/bubble.png" alt="bubble_4">
            <img src="media/bubble.png" alt="bubble_5">
            <img src="media/bubble.png" alt="bubble_6">
            <img src="media/bubble.png" alt="bubble_7">
        </div>
    </div>
</body>
</html>
